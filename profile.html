<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heyfo - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
            --modal-bg: #0b132b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            overflow-y: auto;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            padding: 16px; 
            margin: 0 auto;
            padding-bottom: 110px; 
            box-sizing: border-box; 
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: translateX(0);
        }

        .container.page-slide-out {
            opacity: 0;
            transform: translateX(-20px);
        }

        .top-header h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .profile-card {
            background: linear-gradient(135deg, #131c2e 0%, #1e1b4b 100%);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 16px;
            transition: 0.3s ease;
        }

        .profile-card.verified { 
            background: linear-gradient(135deg, #1e1b4b 0%, #3b0764 50%, #1e1b4b 100%);
            border: 2px solid #a855f7; 
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            animation: premiumGlow 3s infinite alternate;
        }

        @keyframes premiumGlow {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 10px rgba(168, 85, 247, 0.1); }
            100% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.6), inset 0 0 20px rgba(236, 72, 153, 0.2); }
        }

        .profile-left { display: flex; align-items: center; gap: 14px; width: 100%; }
        
        .avatar-container { 
            width: 65px; height: 65px; border-radius: 50%; padding: 2px; 
            background: linear-gradient(135deg, #7c3aed, #ec4899); 
            flex-shrink: 0; position: relative; 
        }
        .profile-card.verified .avatar-container { animation: avatarPulse 2s infinite alternate; }
        @keyframes avatarPulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(168, 85, 247, 0.9); }
        }

        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .verified-badge {
            position: absolute; bottom: 0; right: 0;
            background: #22c55e; color: #fff; width: 20px; height: 20px;
            border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center;
            border: 2px solid #131c2e; display: none;
        }

        .profile-info { width: 100%; }
        .profile-info h3 { margin: 0 0 2px 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 6px; }
        .username-text { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .user-id-badge { font-size: 11px; color: #c084fc; font-weight: 650; cursor: pointer; display: inline-block; background: rgba(124, 58, 237, 0.15); padding: 1px 6px; border-radius: 6px; }

        .premium-badge-tag {
            background: linear-gradient(135deg, #f59e0b, #ec4899); color: #fff;
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
            display: none; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; text-align: center; }
        .stat-card .stat-value { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: #fbbf24; }
        .stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        
        .collection-item-box { 
            background: #0b0f19; 
            border: 1px solid var(--card-border); 
            padding: 10px 12px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer;
            transition: 0.2s;
        }
        .collection-item-box:hover { border-color: #7c3aed; background: #131c2e; }

        .menu-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .menu-row-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text-main); transition: 0.2s; cursor: pointer; }
        .menu-row-left { display: flex; align-items: center; gap: 14px; }
        .menu-row-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }

        .coming-soon-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.3); }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; display: none; margin-top: 10px; }
        .admin-box-item { background: linear-gradient(135deg, rgba(6, 78, 59, 0.4), rgba(2, 44, 34, 0.6)); border: 1px solid #22c55e; border-radius: 14px; padding: 12px; text-align: center; text-decoration: none; color: #34d399; }
        .admin-box-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .admin-box-item h5 { margin: 0; font-size: 11px; font-weight: 700; color: #fff; }

        /* অর্ডার ডিটেইলস পপআপ মডাল */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; backdrop-filter: blur(6px); }
        .modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: var(--modal-bg);
            border: 2px solid #7c3aed; border-radius: 20px; padding: 20px;
            width: 90%; max-width: 380px; z-index: 1001; box-sizing: border-box;
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4); text-align: left;
        }
        .modal h3 { margin: 0 0 12px 0; font-size: 16px; color: #fbbf24; text-align: center; }
        .modal-close-btn { background: #7c3aed; color: #fff; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 14px; font-weight: bold; cursor: pointer; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 12px 0 16px 0; box-sizing: border-box; z-index: 9999; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-header">
            <div><h1>Heyfo Profile</h1></div>
        </div>

        <div class="profile-card" id="profileCardElement">
            <div class="profile-left">
                <div class="avatar-container">
                    <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar">
                    <div class="verified-badge" id="verifiedBadgeIcon"><i class="fa-solid fa-check"></i></div>
                </div>
                <div class="profile-info">
                    <h3 id="profile-name">
                        <span id="name-text">User</span> 
                        <span class="premium-badge-tag" id="premiumBadgeTag"><i class="fa-solid fa-crown"></i> VIP</span>
                    </h3>
                    <div class="username-text" id="profile-username">@user</div>
                    <div><span class="user-id-badge" id="profile-id">ID: Loading... 📋</span></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">⚡ <span id="total-gp">0</span> GP</div>
                <div class="stat-label">Fuel Balance (GP)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">🪙 <span id="total-gold">0</span> Gold</div>
                <div class="stat-label">Shopping Coins (Gold)</div>
            </div>
        </div>

        <!-- অর্ডার হিস্ট্রি সেকশন -->
        <div class="card">
            <h4 style="margin: 0 0 8px 0; font-size: 13px; color: #fff;"><i class="fa-solid fa-clock-rotate-left" style="color: #c084fc;"></i> My Order History</h4>
            <div id="my-collection-list" style="max-height: 200px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading your order history...</small>
            </div>
        </div>

        <div class="menu-list">
            <a class="menu-row-item" href="support.html">
                <div class="menu-row-left">
                    <div class="menu-row-icon" style="background: #0891b2;"><i class="fa-solid fa-headset"></i></div>
                    <div class="menu-row-info">
                        <h5 style="margin:0; font-size:13px; color:#fff;">Help & Support</h5>
                        <p style="margin:0; font-size:11px; color:var(--text-muted);">Get help and contact admin</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);"></i>
            </a>

            <div class="admin-grid" id="adminGridContainer">
                <a class="admin-box-item" href="mainadmin.html">
                    <i class="fa-solid fa-user-shield"></i>
                    <h5>Main Admin</h5>
                </a>
                <a class="admin-box-item" href="shopadmin.html">
                    <i class="fa-solid fa-store"></i>
                    <h5>Shop Admin</h5>
                </a>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="overlay" id="orderModalOverlay" onclick="closeOrderModal()"></div>
    <div class="modal" id="orderModal">
        <h3>Order Details 📦</h3>
        <div id="modalOrderContent" style="font-size: 13px; line-height: 1.6; color: var(--text-muted);">
            <!-- Dynamic Details -->
        </div>
        <button class="modal-close-btn" onclick="closeOrderModal()">Close</button>
    </div>

    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 
        let firstName = user ? (user.first_name || "User") : "User";
        let username = (user && user.username) ? `@${user.username}` : `@user`;
        const ADMIN_USER_ID = "7757851056";

        document.getElementById('name-text').innerText = firstName;
        document.getElementById('profile-username').innerText = username;
        document.getElementById('profile-id').innerText = `ID: ${userId} 📋`;

        if (user && user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
        }

        if (userId === ADMIN_USER_ID) {
            document.getElementById('adminGridContainer').style.display = "grid";
        }

        db.ref('users/' + userId).on('value', snap => {
            let data = snap.val();
            if(data) {
                let gp = data.gp !== undefined ? data.gp : (data.points || 0);
                let gold = data.gold !== undefined ? data.gold : 0;
                document.getElementById('total-gp').innerText = gp.toLocaleString();
                document.getElementById('total-gold').innerText = gold.toLocaleString();

                if (data.isVerified === true) {
                    document.getElementById('profileCardElement').classList.add('verified');
                    document.getElementById('verifiedBadgeIcon').style.display = 'flex';
                    document.getElementById('premiumBadgeTag').style.display = 'inline-block';
                }
            }
        });

        let cachedOrders = {};

        // ফায়ারবেস থেকে ইউজারের শপ অর্ডারগুলো লোড করা (Pending, Accepted, Rejected স্ট্যাটাস সহ)
        db.ref('shop_orders').orderByChild('userId').equalTo(userId).on('value', snap => {
            let container = document.getElementById('my-collection-list');
            let html = "";
            cachedOrders = {};

            if (snap.exists()) {
                let ordersArray = [];
                snap.forEach(child => {
                    let orderKey = child.key;
                    let order = child.val();
                    order.id = orderKey;
                    ordersArray.push(order);
                    cachedOrders[orderKey] = order;
                });

                ordersArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                ordersArray.forEach(order => {
                    let orderDate = order.timestamp ? new Date(order.timestamp).toLocaleDateString() : 'N/A';
                    let status = order.status || 'Pending';
                    
                    let badgeColor = '#f59e0b'; // Pending (Yellow)
                    let badgeBg = 'rgba(245, 158, 11, 0.15)';
                    if (status === 'Accepted') {
                        badgeColor = '#22c55e'; // Green
                        badgeBg = 'rgba(34, 197, 94, 0.15)';
                    } else if (status === 'Rejected') {
                        badgeColor = '#ef4444'; // Red
                        badgeBg = 'rgba(239, 68, 68, 0.15)';
                    }

                    html += `
                        <div class="collection-item-box" onclick="openOrderDetails('${order.id}')">
                            <div>
                                <b style="font-size: 12px; color: #fff;"><i class="fa-solid fa-bag-shopping" style="color: #c084fc;"></i> ${order.itemName}</b><br>
                                <span style="color: #94a3b8; font-size: 10px;">Date: ${orderDate} | ID: #${order.id.slice(-6)}</span>
                            </div>
                            <span style="font-size: 10px; font-weight: bold; color: ${badgeColor}; background: ${badgeBg}; padding: 3px 8px; border-radius: 6px;">${status}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No order history found. Visit shop to make orders!</small>`;
            }
        });

        function openOrderDetails(orderId) {
            let order = cachedOrders[orderId];
            if (!order) return;

            let orderDate = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'N/A';
            let status = order.status || 'Pending';

            let content = `
                <b>Order Number:</b> <span style="color:#fff;">#${order.id}</span><br>
                <b>Item Name:</b> <span style="color:#c084fc;">${order.itemName}</span><br>
                <b>Price:</b> 🪙 <span style="color:#fbbf24;">${order.price} Gold</span><br>
                <b>Order Date:</b> ${orderDate}<br>
                <b>Current Status:</b> <span style="color:${status === 'Accepted' ? '#22c55e' : (status === 'Rejected' ? '#ef4444' : '#f59e0b')}; font-weight:bold;">${status}</span><br>
                ${status === 'Rejected' ? '<br><small style="color:#ef4444;">Note: This order was rejected and your gold has been refunded.</small>' : ''}
            `;

            document.getElementById('modalOrderContent').innerHTML = content;
            document.getElementById('orderModalOverlay').style.display = 'block';
            document.getElementById('orderModal').style.display = 'block';
        }

        function closeOrderModal() {
            document.getElementById('orderModalOverlay').style.display = 'none';
            document.getElementById('orderModal').style.display = 'none';
        }
    </script>
</body>
</html>
