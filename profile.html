<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heyfo - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; justify-content: center; box-sizing: border-box;
            overflow-x: hidden; overscroll-behavior-y: none;
            position: relative;
        }

        .container { 
            width: 100%; max-width: 480px; padding: 16px; margin: 0 auto;
            padding-bottom: 110px; box-sizing: border-box; 
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-slide-left { transform: translateX(-50px); opacity: 0; }
        .page-slide-right { transform: translateX(50px); opacity: 0; }

        .top-header h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .profile-card {
            background: linear-gradient(135deg, #131c2e 0%, #1e1b4b 100%);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
            transition: 0.3s;
        }

        .profile-card.verified-card {
            background: linear-gradient(135deg, #131c2e 0%, #064e3b 100%) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }

        .profile-left { display: flex; align-items: center; gap: 14px; width: 100%; }
        
        .avatar-container { width: 65px; height: 65px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #7c3aed, #ec4899); flex-shrink: 0; position: relative; transition: 0.3s; }
        
        .avatar-container.verified-avatar {
            background: linear-gradient(135deg, #22c55e, #3b82f6) !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .profile-info h3 { margin: 0 0 2px 0; font-size: 16px; color: #fff; display: flex; align-items: center; flex-wrap: wrap; }
        .username-text { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .user-id-badge { font-size: 11px; color: #c084fc; font-weight: 650; background: rgba(124, 58, 237, 0.15); padding: 1px 6px; border-radius: 6px; }

        .verified-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; text-align: center; }
        .stat-card .stat-value { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: #fbbf24; }
        .stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 10px 0; font-size: 13px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 8px 10px; border-radius: 8px; box-sizing: border-box; font-size: 12px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }

        .action-sm-btn { background: #7c3aed; color: #fff; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; margin-top: 4px; }

        .item-box { 
            background: #0b0f19; border: 1px solid var(--card-border); 
            padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 12px; 
        }

        .menu-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .menu-row-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text-main); }
        .menu-row-left { display: flex; align-items: center; gap: 14px; }
        .menu-row-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; display: none; margin-top: 10px; }
        .admin-box-item { background: linear-gradient(135deg, rgba(6, 78, 59, 0.4), rgba(2, 44, 34, 0.6)); border: 1px solid #22c55e; border-radius: 14px; padding: 12px; text-align: center; text-decoration: none; color: #34d399; }
        .admin-box-item i { font-size: 18px; margin-bottom: 4px; display: block; }
        .admin-box-item h5 { margin: 0; font-size: 11px; font-weight: 700; color: #fff; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg); 
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; 
            padding: 12px 0 16px 0; box-sizing: border-box; z-index: 9999; 
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; transition: color 0.2s, transform 0.2s; }
        .nav-item.active { color: #c084fc; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="top-header">
            <div><h1>Heyfo Profile</h1></div>
        </div>

        <div class="profile-card" id="profileCardElement">
            <div class="profile-left">
                <div class="avatar-container" id="avatarContainerBox">
                    <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar">
                </div>
                <div class="profile-info">
                    <h3 id="profile-name">
                        <span id="name-text">User</span>
                        <span id="verifiedBadgeContainer"></span>
                    </h3>
                    <div class="username-text" id="profile-username">@user</div>
                    <div><span class="user-id-badge" id="profile-id">ID: Loading... 📋</span></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">⚡ <span id="total-gp">0</span> GP</div>
                <div class="stat-label">Fuel Balance (GP)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">🪙 <span id="total-gold">0</span> Gold</div>
                <div class="stat-label">Shopping Coins (Gold)</div>
            </div>
        </div>

        <!-- ১. Payment / Wallet Setup সেকশন (USDT Address & Exchange UID বাধ্যতামূলক) -->
        <div class="card">
            <h4><i class="fa-solid fa-wallet" style="color: #34d399;"></i> Crypto Payment Setup</h4>
            <div class="form-group">
                <label>USDT TRC20 Address *</label>
                <input type="text" id="usdtAddressInput" class="form-control" placeholder="Enter your USDT TRC20 address...">
            </div>
            <div class="form-group">
                <label>Exchange UID (Binance / Bitget) *</label>
                <input type="text" id="exchangeUidInput" class="form-control" placeholder="Enter your Exchange UID...">
            </div>
            <button class="action-sm-btn" onclick="saveWalletInfo()">Save Payment Details</button>
        </div>

        <!-- ২. Purchased Dollar Cards সেকশন -->
        <div class="card">
            <h4><i class="fa-solid fa-credit-card" style="color: #3b82f6;"></i> My Purchased Dollar Cards</h4>
            <div id="dollarCardsContainer" style="max-height: 220px; overflow-y: auto;">
                <small style="color: var(--text-muted);">No dollar cards purchased yet.</small>
            </div>
        </div>

        <div class="menu-list">
            <a class="menu-row-item" href="support.html">
                <div class="menu-row-left">
                    <div class="menu-row-icon" style="background: #0891b2;"><i class="fa-solid fa-headset"></i></div>
                    <div class="menu-row-info">
                        <h5 style="margin:0; font-size:13px; color:#fff;">Help & Support</h5>
                        <p style="margin:0; font-size:11px; color:var(--text-muted);">Get help and contact admin</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color:var(--text-muted);"></i>
            </a>

            <div class="admin-grid" id="adminGridContainer">
                <a class="admin-box-item" href="mainadmin.html">
                    <i class="fa-solid fa-user-shield"></i>
                    <h5>Main Admin</h5>
                </a>
                <a class="admin-box-item" href="shopadmin.html">
                    <i class="fa-solid fa-store"></i>
                    <h5>Shop Admin</h5>
                </a>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056"; 
        let firstName = user ? (user.first_name || "User") : "User";
        const ADMIN_USER_ID = "7757851056";

        document.getElementById('name-text').innerText = firstName;
        document.getElementById('profile-username').innerText = user && user.username ? `@${user.username}` : `@user`;
        document.getElementById('profile-id').innerText = `ID: ${userId} 📋`;

        if (user && user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
        }

        if (userId === ADMIN_USER_ID) {
            document.getElementById('adminGridContainer').style.display = "grid";
        }

        // ফায়ারবেস থেকে ইউজারের ডাটা লোড ও ওয়ালেট ইনফো সেটআপ ফিল্ড পূরণ করা
        db.ref('users/' + userId).on('value', snap => {
            let data = snap.val();
            if(data) {
                let gp = data.gp !== undefined ? data.gp : (data.points || 0);
                let gold = data.gold !== undefined ? data.gold : 0;
                document.getElementById('total-gp').innerText = gp.toLocaleString();
                document.getElementById('total-gold').innerText = gold.toLocaleString();

                if (data.wallet_info) {
                    if(data.wallet_info.usdtAddress) document.getElementById('usdtAddressInput').value = data.wallet_info.usdtAddress;
                    if(data.wallet_info.exchangeUid) document.getElementById('exchangeUidInput').value = data.wallet_info.exchangeUid;
                }

                // ভেরিফিকেশন স্ট্যাটাস চেক
                let isVerified = data.isVerified || false;
                if (isVerified) {
                    document.getElementById('avatarContainerBox').classList.add('verified-avatar');
                    document.getElementById('profileCardElement').classList.add('verified-card');
                    document.getElementById('verifiedBadgeContainer').innerHTML = `<span class="verified-badge"><i class="fa-solid fa-circle-check"></i> Verified</span>`;
                }
            }
        });

        function saveWalletInfo() {
            let usdtAddress = document.getElementById('usdtAddressInput').value.trim();
            let exchangeUid = document.getElementById('exchangeUidInput').value.trim();

            if (!usdtAddress || !exchangeUid) {
                tg.showAlert("⚠️ Both USDT Address and Exchange UID are compulsory!");
                return;
            }

            db.ref(`users/${userId}/wallet_info`).set({
                usdtAddress: usdtAddress,
                exchangeUid: exchangeUid,
                updatedAt: Date.now()
            }).then(() => {
                tg.showAlert("✅ Payment details saved successfully!");
            });
        }

        // ইউজারের কেনা ডলার কার্ডের অর্ডার হিস্ট্রি লোড করা
        db.ref('dollar_card_orders').on('value', snap => {
            let container = document.getElementById('dollarCardsContainer');
            let html = "";

            if (snap.exists()) {
                let ordersArr = [];
                snap.forEach(child => {
                    let order = child.val();
                    if (order.userId && order.userId.toString() === userId.toString()) {
                        ordersArr.push(order);
                    }
                });

                if (ordersArr.length > 0) {
                    ordersArr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    ordersArr.forEach(order => {
                        let date = order.timestamp ? new Date(order.timestamp).toLocaleDateString() : 'N/A';
                        let status = order.status || 'Pending';

                        let badgeColor = '#f59e0b';
                        let badgeBg = 'rgba(245, 158, 11, 0.15)';
                        if (status === 'Approved') { badgeColor = '#22c55e'; badgeBg = 'rgba(34, 197, 94, 0.15)'; }
                        else if (status === 'Rejected') { badgeColor = '#ef4444'; badgeBg = 'rgba(239, 68, 68, 0.15)'; }

                        html += `
                            <div class="item-box">
                                <div>
                                    <b style="color: #fff;"><i class="fa-solid fa-wallet" style="color: #34d399;"></i> ${order.cardName}</b><br>
                                    <span style="color: #fbbf24; font-size: 10px;">🪙 ${order.price.toLocaleString()} Gold</span> | 
                                    <span style="color: #94a3b8; font-size: 10px;">Date: ${date}</span>
                                </div>
                                <span style="font-size: 10px; font-weight: bold; color: ${badgeColor}; background: ${badgeBg}; padding: 3px 8px; border-radius: 6px;">${status}</span>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<small style="color: var(--text-muted);">No dollar cards purchased yet.</small>`;
                }
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No dollar cards purchased yet.</small>`;
            }
        });

        // সোয়াইপ নেভিগেশন সিস্টেম (ডানে সোয়াইপ -> Game পেজ, বামে সোয়াইপ -> Task পেজ)
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchEndX - touchStartX;
            const container = document.getElementById('mainContainer');

            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    container.classList.add('page-slide-right');
                    setTimeout(() => { window.location.href = "game.html"; }, 250);
                } else {
                    container.classList.add('page-slide-left');
                    setTimeout(() => { window.location.href = "task.html"; }, 250);
                }
            }
        });
    </script>
</body>
</html>
