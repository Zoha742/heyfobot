<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Shop Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h3 { margin: 0; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        /* ট্যাব নেভিগেশন (Order & Product Add) */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; transition: 0.2s; }
        .tab-btn.active { background: var(--primary-gradient); background-color: #7c3aed; color: #fff; border-color: #7c3aed; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }

        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .action-btn:hover { background: #6d28d9; }

        .item-box, .order-box { background: #0b0f19; border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .item-info, .order-info { font-size: 12px; margin-bottom: 8px; }
        
        .btn-group { display: flex; gap: 6px; }
        .accept-btn { background: #22c55e; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; flex: 1; }
        .reject-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; flex: 1; }
        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }

        /* রিজেক্ট করার কারণ লেখার ইনপুট মডাল বা বক্স */
        .reason-box { display: none; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-store" style="color: #22c55e;"></i> Shop Admin Dashboard</h3>
            <a href="mainadmin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        </div>

        <!-- ট্যাব বাটন -->
        <div class="tab-menu">
            <div class="tab-btn active" onclick="switchTab('ordersTab', this)"><i class="fa-solid fa-box-open"></i> Orders</div>
            <div class="tab-btn" onclick="switchTab('productTab', this)"><i class="fa-solid fa-plus-circle"></i> Product Add</div>
        </div>

        <!-- ১. অর্ডার ম্যানেজমেন্ট ট্যাব -->
        <div id="ordersTab" class="tab-content active">
            <div class="card">
                <h4><i class="fa-solid fa-clipboard-list"></i> Customer Orders & Requests</h4>
                <div id="ordersListContainer">
                    <small style="color: var(--text-muted);">Loading customer orders...</small>
                </div>
            </div>
        </div>

        <!-- ২. প্রডাক্ট অ্যাড ও ম্যানেজমেন্ট ট্যাব -->
        <div id="productTab" class="tab-content">
            <div class="card">
                <h4><i class="fa-solid fa-circle-plus"></i> Add New Dress / Product</h4>
                <div class="form-group">
                    <label>Product / Dress Name</label>
                    <input type="text" id="itemName" class="form-control" placeholder="e.g. Royal Gown">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="itemCat" class="form-control">
                        <option value="Dress">Female Wardrobe</option>
                        <option value="Boys">Boys Wardrobe</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (Gold Coins)</label>
                    <input type="number" id="itemPrice" class="form-control" placeholder="15000">
                </div>
                <div class="form-group">
                    <label>Image URL (Cloudinary / Direct Link)</label>
                    <input type="text" id="itemImg" class="form-control" placeholder="https://...">
                </div>
                <button class="action-btn" onclick="addNewItem()">Add Product to Shop</button>
            </div>

            <div class="card">
                <h4><i class="fa-solid fa-list"></i> Manage Existing Products</h4>
                <div id="shopItemsList">
                    <small style="color: var(--text-muted);">Loading shop items...</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        const ADMIN_USER_ID = "7757851056";

        if (userId !== ADMIN_USER_ID) {
            alert("Access Denied!");
            window.location.href = "index.html";
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // প্রডাক্ট অ্যাড করার ফাংশন
        function addNewItem() {
            let name = document.getElementById('itemName').value.trim();
            let cat = document.getElementById('itemCat').value;
            let price = parseInt(document.getElementById('itemPrice').value);
            let img = document.getElementById('itemImg').value.trim();

            if (!name || !price || !img) {
                tg.showAlert("⚠️ Please fill in all fields correctly!");
                return;
            }

            let newItemData = {
                name: name,
                cat: cat,
                price: price,
                img: img,
                timestamp: Date.now()
            };

            db.ref('shop_items').push(newItemData).then(() => {
                tg.showAlert("✅ Product added successfully to the shop!");
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemImg').value = '';
            });
        }

        // প্রডাক্ট লিস্ট ও ডিলিট ম্যানেজমেন্ট
        db.ref('shop_items').on('value', snap => {
            let container = document.getElementById('shopItemsList');
            let html = "";
            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let key = childSnap.key;
                    let item = childSnap.val();
                    html += `
                        <div class="item-box" style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="item-info">
                                <b>${item.name}</b> (${item.cat})<br>
                                <span style="color: #fbbf24;">🪙 ${item.price.toLocaleString()} Gold</span>
                            </div>
                            <button class="delete-btn" onclick="deleteShopItem('${key}')">Delete</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No products found.</small>`;
            }
        });

        function deleteShopItem(itemKey) {
            if(confirm("Are you sure you want to delete this product?")) {
                db.ref('shop_items/' + itemKey).remove().then(() => {
                    tg.showAlert("🗑️ Product deleted successfully!");
                });
            }
        }

        // অর্ডার লিস্ট লোড এবং ম্যানেজমেন্ট (Accept / Reject with Fund Back & Reason Inbox)
        db.ref('shop_orders').on('value', snap => {
            let container = document.getElementById('ordersListContainer');
            let html = "";
            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let orderKey = childSnap.key;
                    let order = childSnap.val();
                    let orderDate = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'N/A';

                    html += `
                        <div class="order-box" id="order-${orderKey}">
                            <div class="order-info">
                                <b>User ID:</b> ${order.userId}<br>
                                <b>Item:</b> <span style="color:#c084fc;">${order.itemName}</span><br>
                                <b>Price:</b> 🪙 ${order.price} Gold<br>
                                <b>Status:</b> <span style="color:${order.status === 'Accepted' ? '#22c55e' : (order.status === 'Rejected' ? '#ef4444' : '#fbbf24')}">${order.status || 'Pending'}</span><br>
                                <span style="font-size:10px; color:var(--text-muted);">${orderDate}</span>
                            </div>
                            ${(!order.status || order.status === 'Pending') ? `
                                <div class="btn-group">
                                    <button class="accept-btn" onclick="processOrder('${orderKey}', '${order.userId}', 'Accepted', 0)">Accept</button>
                                    <button class="reject-btn" onclick="toggleReasonBox('${orderKey}')">Reject</button>
                                </div>
                                <div class="reason-box" id="reasonBox-${orderKey}">
                                    <input type="text" id="reasonInput-${orderKey}" class="form-control" placeholder="Reason for rejection..." style="margin-top:6px; margin-bottom:6px;">
                                    <button class="action-btn" style="padding:6px; font-size:11px;" onclick="processOrder('${orderKey}', '${order.userId}', 'Rejected', ${order.price})">Confirm Rejection & Refund</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No orders found.</small>`;
            }
        });

        function toggleReasonBox(orderKey) {
            let box = document.getElementById(`reasonBox-${orderKey}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function processOrder(orderKey, targetUserId, status, refundAmount) {
            let reason = "";
            if (status === 'Rejected') {
                reason = document.getElementById(`reasonInput-${orderKey}`).value.trim();
                if (!reason) {
                    alert("Please write a reason for rejection!");
                    return;
                }
            }

            // অর্ডারের স্ট্যাটাস আপডেট করা
            let updates = {};
            updates[`shop_orders/${orderKey}/status`] = status;

            // যদি রিজেক্ট হয়, তবে ইউজারের ব্যালেন্সে গোল্ড রিফান্ড করা এবং নোটিফিকেশন/ইনবক্সে মেসেজ পাঠানো
            if (status === 'Rejected' && refundAmount > 0) {
                db.ref(`users/${targetUserId}/gold`).once('value').then(snap => {
                    let currentGold = snap.val() || 0;
                    let newGold = currentGold + refundAmount;
                    db.ref(`users/${targetUserId}`).update({ gold: newGold });
                });

                let notifData = {
                    title: "Order Rejected & Refunded",
                    message: `Your order was rejected. Reason: ${reason}. 🪙 ${refundAmount} Gold has been refunded to your account.`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData);
            } else if (status === 'Accepted') {
                let notifData = {
                    title: "Order Accepted",
                    message: `Congratulations! Your dress order has been accepted successfully.`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData);
            }

            db.ref().update(updates).then(() => {
                tg.showAlert(`Order ${status} successfully!`);
            });
        }
    </script>
</body>
</html>
