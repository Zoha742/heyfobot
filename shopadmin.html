<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Dollar Card Orders Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h3 { margin: 0; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }

        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .action-btn:hover { background: #6d28d9; }

        .order-box { background: #0b0f19; border: 1px solid var(--card-border); padding: 14px; border-radius: 14px; margin-bottom: 12px; }
        .order-info { font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
        
        .btn-group { display: flex; gap: 8px; }
        .accept-btn { background: #22c55e; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; flex: 1; }
        .reject-btn { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; flex: 1; }

        .reason-box { display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-credit-card" style="color: #34d399;"></i> Dollar Card Orders</h3>
            <a href="mainadmin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        </div>

        <div class="card">
            <h4><i class="fa-solid fa-clipboard-list"></i> Pending Customer Orders</h4>
            <div id="dollarOrdersListContainer">
                <small style="color: var(--text-muted);">Loading dollar card orders...</small>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        const ADMIN_USER_ID = "7757851056";

        if (userId !== ADMIN_USER_ID) {
            alert("Access Denied!");
            window.location.href = "index.html";
        }

        // ফায়ারবেসের dollar_card_orders থেকে লাইভ অর্ডার ফেচ করা
        db.ref('dollar_card_orders').on('value', snap => {
            let container = document.getElementById('dollarOrdersListContainer');
            let html = "";
            if (snap.exists()) {
                let ordersArray = [];
                snap.forEach(childSnap => {
                    let order = childSnap.val();
                    order.id = childSnap.key;
                    ordersArray.push(order);
                });

                // নতুন অর্ডারগুলো সবার উপরে দেখানোর জন্য সর্টিং
                ordersArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                ordersArray.forEach(order => {
                    let orderDate = order.timestamp ? new Date(order.timestamp).toLocaleString() : 'N/A';
                    let status = order.status || 'Pending';

                    let statusColor = '#fbbf24';
                    if (status === 'Approved') statusColor = '#22c55e';
                    else if (status === 'Rejected') statusColor = '#ef4444';

                    html += `
                        <div class="order-box" id="order-${order.id}">
                            <div class="order-info">
                                <b>User:</b> ${order.userName || 'User'} (ID: ${order.userId})<br>
                                <b>Card Item:</b> <span style="color:#34d399; font-weight:bold;">${order.cardName}</span><br>
                                <b>Cost:</b> 🪙 ${order.price.toLocaleString()} Gold<br>
                                <b>USDT Address:</b> <span style="color:#38bdf8; font-family:monospace;">${order.usdtAddress}</span><br>
                                <b>Exchange UID:</b> <span style="color:#c084fc; font-family:monospace; font-weight:bold;">${order.exchangeUid}</span><br>
                                <b>Status:</b> <span style="color:${statusColor}; font-weight:bold;">${status}</span><br>
                                <span style="font-size:10px; color:var(--text-muted);">${orderDate}</span>
                            </div>
                            ${status === 'Pending' ? `
                                <div class="btn-group">
                                    <button class="accept-btn" onclick="processOrder('${order.id}', '${order.userId}', 'Approved', 0)">Approve</button>
                                    <button class="reject-btn" onclick="toggleReasonBox('${order.id}')">Reject & Refund</button>
                                </div>
                                <div class="reason-box" id="reasonBox-${order.id}">
                                    <input type="text" id="reasonInput-${order.id}" class="form-control" placeholder="Reason for rejection..." style="margin-top:6px; margin-bottom:6px;">
                                    <button class="action-btn" style="padding:6px; font-size:11px;" onclick="processOrder('${order.id}', '${order.userId}', 'Rejected', ${order.price})">Confirm Rejection & Refund</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No dollar card orders found.</small>`;
            }
        });

        function toggleReasonBox(orderKey) {
            let box = document.getElementById(`reasonBox-${orderKey}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function processOrder(orderKey, targetUserId, status, refundAmount) {
            let reason = "";
            if (status === 'Rejected') {
                reason = document.getElementById(`reasonInput-${orderKey}`).value.trim();
                if (!reason) {
                    alert("Please write a reason for rejection!");
                    return;
                }
            }

            let updates = {};
            updates[`dollar_card_orders/${orderKey}/status`] = status;

            if (status === 'Rejected' && refundAmount > 0) {
                db.ref(`users/${targetUserId}/gold`).once('value').then(snap => {
                    let currentGold = snap.val() || 0;
                    db.ref(`users/${targetUserId}`).update({ gold: currentGold + refundAmount });
                });

                let notifData = {
                    title: "Dollar Order Rejected & Refunded",
                    message: `Your dollar card order was rejected. Reason: ${reason}. 🪙 ${refundAmount.toLocaleString()} Gold has been refunded.`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData);
            } else if (status === 'Approved') {
                let notifData = {
                    title: "Dollar Card Approved! 🎉",
                    message: `Congratulations! Your dollar card order has been approved and sent to your UID/USDT address.`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData);
            }

            db.ref().update(updates).then(() => {
                tg.showAlert(`Order status updated to ${status} successfully!`);
            });
        }
    </script>
</body>
</html>
