<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Shop Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h3 { margin: 0; color: #fff; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        
        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .action-btn:hover { background: #6d28d9; }

        .item-box { background: #0b0f19; border: 1px solid var(--card-border); padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { font-size: 12px; }
        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-store" style="color: #22c55e;"></i> Shop Admin Panel</h3>
            <a href="appboss.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        </div>

        <!-- নতুন আইটেম অ্যাড করার ফর্ম -->
        <div class="card">
            <h4><i class="fa-solid fa-plus-circle"></i> Add New Wardrobe Item</h4>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" class="form-control" placeholder="e.g. Royal Gown">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="itemCat" class="form-control">
                    <option value="Dress">Female Wardrobe</option>
                    <option value="Boys">Boys Wardrobe</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (Gold Points)</label>
                <input type="number" id="itemPrice" class="form-control" placeholder="15000">
            </div>
            <div class="form-group">
                <label>Image URL (Cloudinary / Direct Link)</label>
                <input type="text" id="itemImg" class="form-control" placeholder="https://...">
            </div>
            <button class="action-btn" onclick="addNewItem()">Add Item to Shop</button>
        </div>

        <!-- লাইভ শপ আইটেম লিস্ট -->
        <div class="card">
            <h4><i class="fa-solid fa-list"></i> Manage Shop Items</h4>
            <div id="shopItemsList">
                <small style="color: var(--text-muted);">Loading shop items...</small>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        const ADMIN_USER_ID = "7757851056";

        // সিকিউরিটি চেক: শুধুমাত্র আপনি (এডমিন) এক্সেস করতে পারবেন
        if (userId !== ADMIN_USER_ID) {
            alert("Access Denied!");
            window.location.href = "index.html";
        }

        function addNewItem() {
            let name = document.getElementById('itemName').value.trim();
            let cat = document.getElementById('itemCat').value;
            let price = parseInt(document.getElementById('itemPrice').value);
            let img = document.getElementById('itemImg').value.trim();

            if (!name || !price || !img) {
                tg.showAlert("⚠️ Please fill in all fields correctly!");
                return;
            }

            let newItemData = {
                name: name,
                cat: cat,
                price: price,
                img: img,
                hasSize: true,
                timestamp: Date.now()
            };

            db.ref('shop_items').push(newItemData).then(() => {
                tg.showAlert("✅ Item added successfully to the shop!");
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemImg').value = '';
            });
        }

        // ফায়ারবেস থেকে শপের আইটেমগুলো লোড ও ম্যানেজ করা
        db.ref('shop_items').on('value', snap => {
            let container = document.getElementById('shopItemsList');
            let html = "";
            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let key = childSnap.key;
                    let item = childSnap.val();
                    html += `
                        <div class="item-box">
                            <div class="item-info">
                                <b>${item.name}</b> (${item.cat})<br>
                                <span style="color: #fbbf24;">🪙 ${item.price.toLocaleString()} Gold</span>
                            </div>
                            <button class="delete-btn" onclick="deleteShopItem('${key}')">Delete</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No custom items found in database.</small>`;
            }
        });

        function deleteShopItem(itemKey) {
            if(confirm("Are you sure you want to delete this item?")) {
                db.ref('shop_items/' + itemKey).remove().then(() => {
                    tg.showAlert("🗑️ Item deleted successfully!");
                });
            }
        }
    </script>
</body>
</html>
