<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Agent Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h3 { margin: 0; color: #fff; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 10px 0; font-size: 15px; color: #c084fc; display: flex; align-items: center; gap: 8px; }
        .card p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 0 0 14px 0; }

        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 12px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; cursor: pointer; transition: 0.2s; box-sizing: border-box; }
        .action-btn:hover { background: #6d28d9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-handshake" style="color: #fbbf24;"></i> Agent Center</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <div class="card">
            <h4><i class="fa-solid fa-user-tie"></i> Become a Heyfo Agent</h4>
            <p>Promote Heyfo, invite friends, and manage your community tasks to earn extra rewards and bonuses directly from the platform.</p>
            <button class="action-btn" onclick="tg.showAlert('Agent program is currently active for authorized partners!')">
                <i class="fa-solid fa-star"></i> View Agent Status
            </button>
        </div>

        <div class="card">
            <h4><i class="fa-solid fa-link"></i> Referral Program</h4>
            <p>Share your unique referral link with your friends and earn bonus GP and Gold points when they join Heyfo!</p>
            <button class="action-btn" style="background: #22c55e;" onclick="copyReferralLink()">
                <i class="fa-solid fa-copy"></i> Copy Referral Link
            </button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";

        function copyReferralLink() {
            let refLink = `https://t.me/Feldobot/App?start=ref_${userId}`;
            navigator.clipboard.writeText(refLink).then(() => {
                tg.showAlert("✅ Referral link copied to clipboard!");
            });
        }
    </script>
</body>
</html>
