<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Main Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h3 { margin: 0; color: #fff; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .nav-links { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
        .nav-link-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; text-decoration: none; padding: 12px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 13px; display: block; }
        
        .user-row { background: #0b0f19; border: 1px solid var(--card-border); padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-size: 12px; }
        .user-actions { display: flex; gap: 6px; }
        .action-sm-btn { background: #22c55e; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-user-shield" style="color: #34d399;"></i> Heyfo Admin Panel</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <div class="nav-links">
            <a href="shopadmin.html" class="nav-link-btn"><i class="fa-solid fa-store"></i> Manage Shop & Wardrobe Items</a>
        </div>

        <!-- প্ল্যাটফর্ম স্ট্যাটিস্টিকস -->
        <div class="card">
            <h4><i class="fa-solid fa-chart-pie"></i> Platform Overview</h4>
            <p style="font-size: 13px; margin: 0; color: var(--text-muted);">Total Registered Users: <b id="totalUsersCount" style="color: #fff;">0</b></p>
        </div>

        <!-- ইউজার লিস্ট ও ব্যালেন্স ম্যানেজমেন্ট -->
        <div class="card">
            <h4><i class="fa-solid fa-users"></i> User List & Balances</h4>
            <div id="usersListContainer" style="max-height: 300px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading users...</small>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        const ADMIN_USER_ID = "7757851056";

        // সিকিউরিটি চেক
        if (userId !== ADMIN_USER_ID) {
            alert("Access Denied! Admins only.");
            window.location.href = "index.html";
        }

        // ফায়ারবেস থেকে সব ইউজারের ডাটা লোড করা
        db.ref('users').on('value', snap => {
            let container = document.getElementById('usersListContainer');
            let countElem = document.getElementById('totalUsersCount');
            let html = "";
            let count = 0;

            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let uId = childSnap.key;
                    let uData = childSnap.val();
                    count++;

                    let name = uData.name || uData.username || "User";
                    let gp = uData.gp !== undefined ? uData.gp : (uData.points || 0);
                    let gold = uData.gold !== undefined ? uData.gold : 0;

                    html += `
                        <div class="user-row">
                            <div class="user-info">
                                <b>${name}</b><br>
                                <span style="color: #94a3b8; font-size: 10px;">ID: ${uId}</span><br>
                                <span style="color: #fbbf24;">⚡ ${gp} GP | 🪙 ${gold} Gold</span>
                            </div>
                            <div class="user-actions">
                                <button class="action-sm-btn" onclick="addBonus('${uId}', ${gp}, ${gold})">Add +100</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                countElem.innerText = count;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No users found.</small>`;
                countElem.innerText = 0;
            }
        });

        function addBonus(targetId, currentGp, currentGold) {
            let addGp = currentGp + 100;
            db.ref('users/' + targetId).update({ gp: addGp, points: addGp }).then(() => {
                tg.showAlert(`✅ Added 100 GP to User ID: ${targetId}`);
            });
        }
    </script>
</body>
</html>
