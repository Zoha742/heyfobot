<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Super Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h3 { margin: 0; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: #2a1b4e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; text-decoration: none; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .nav-links { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
        .nav-link-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; text-decoration: none; padding: 12px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 13px; display: block; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-box { background: #0b0f19; border: 1px solid var(--card-border); padding: 12px; border-radius: 14px; text-align: center; }
        .stat-box h2 { margin: 0 0 4px 0; color: #fbbf24; font-size: 20px; }
        .stat-box span { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; box-sizing: border-box; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }
        textarea.form-control { resize: none; height: 80px; }

        .action-btn { background: #7c3aed; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .action-btn:hover { background: #6d28d9; }

        .user-row, .ticket-row, .boost-req-row { background: #0b0f19; border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .user-info, .ticket-info, .boost-info { font-size: 12px; margin-bottom: 8px; }
        
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-sm-btn { background: #22c55e; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .ban-btn { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .reset-btn { background: #f59e0b; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        
        .reply-box { display: none; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-user-shield" style="color: #34d399;"></i> Heyfo Super Admin</h3>
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Profile</a>
        </div>

        <div class="nav-links">
            <a href="shopadmin.html" class="nav-link-btn"><i class="fa-solid fa-store"></i> Manage Shop & Orders</a>
        </div>

        <!-- ১. ওভারভিউ স্ট্যাটিস্টিক্স -->
        <div class="stats-grid">
            <div class="stat-box">
                <h2 id="totalUsersCount">0</h2>
                <span>Total Users</span>
            </div>
            <div class="stat-box">
                <h2 id="activeUsersCount">0</h2>
                <span>Active Users (24h)</span>
            </div>
        </div>

        <!-- ২. ইউজারের বুস্ট রিকোয়েস্ট ম্যানেজমেন্ট -->
        <div class="card">
            <h4><i class="fa-solid fa-bolt"></i> User Boost Requests (Pending)</h4>
            <div id="boostRequestsContainer" style="max-height: 250px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading boost requests...</small>
            </div>
        </div>

        <!-- ৩. নোটিফিকেশন সিস্টেম (ফাইল ইমেজ আপলোড সহ) -->
        <div class="card">
            <h4><i class="fa-solid fa-paper-plane"></i> Broadcast Notification with Image</h4>
            <div class="form-group">
                <label>Notification Title</label>
                <input type="text" id="notifTitle" class="form-control" placeholder="e.g. Special Bonus Event!">
            </div>
            <div class="form-group">
                <label>Message Body</label>
                <textarea id="notifMessage" class="form-control" placeholder="Type notification message..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Banner Image</label>
                <input type="file" id="notifImageFile" class="form-control" accept="image/*" style="color: #94a3b8;">
            </div>
            <button class="action-btn" onclick="sendGlobalNotification()">Broadcast Notification</button>
        </div>

        <!-- ৪. সাপোর্ট ইনবক্স ও রিপ্লাই সিস্টেম -->
        <div class="card">
            <h4><i class="fa-solid fa-inbox"></i> Support Inbox & Admin Reply</h4>
            <div id="supportTicketsContainer" style="max-height: 280px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading support tickets...</small>
            </div>
        </div>

        <!-- ৫. ফুল পাওয়ারফুল ইউজার ম্যানেজমেন্ট (Balance Edit, Reset, Ban/Unban) -->
        <div class="card">
            <h4><i class="fa-solid fa-users-gear"></i> Full User Management Control</h4>
            <div id="usersListContainer" style="max-height: 350px; overflow-y: auto;">
                <small style="color: var(--text-muted);">Loading users...</small>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        const ADMIN_USER_ID = "7757851056";

        if (userId !== ADMIN_USER_ID) {
            alert("Access Denied! Admins only.");
            window.location.href = "index.html";
        }

        // ইউজারের বুস্ট রিকোয়েস্ট লোড ও এপ্রুভ/রিজেক্ট সিস্টেম
        db.ref('users').on('value', snap => {
            let container = document.getElementById('boostRequestsContainer');
            let html = "";
            let hasBoosts = false;

            if (snap.exists()) {
                snap.forEach(userSnap => {
                    let uId = userSnap.key;
                    let uData = userSnap.val();
                    if (uData.pending_boosts) {
                        hasBoosts = true;
                        Object.keys(uData.pending_boosts).forEach(boostKey => {
                            let boost = uData.pending_boosts[boostKey];
                            if (boost.status === 'Pending') {
                                html += `
                                    <div class="boost-req-row">
                                        <div class="boost-info">
                                            <b>User:</b> ${boost.userName} (ID: ${uId})<br>
                                            <b>Service:</b> <span style="color:#fbbf24">${boost.serviceName} (${boost.duration})</span><br>
                                            <b>Method:</b> ${boost.method} | <b>Price:</b> ${boost.price}<br>
                                            <a href="${boost.screenshot}" target="_blank" style="color:#38bdf8; font-size:11px;">View Payment Screenshot 📷</a>
                                        </div>
                                        <div class="btn-group">
                                            <button class="action-sm-btn" onclick="approveBoost('${uId}', '${boostKey}', '${boost.serviceId}', '${boost.duration}')">Approve</button>
                                            <button class="ban-btn" onclick="rejectBoost('${uId}', '${boostKey}')">Reject</button>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }
                });
            }
            container.innerHTML = html || `<small style="color: var(--text-muted);">No pending boost requests.</small>`;
        });

        function approveBoost(targetUserId, boostKey, serviceId, durationDaysStr) {
            let daysMatch = parseInt(durationDaysStr) || 5;
            let expireTime = Date.now() + (daysMatch * 24 * 60 * 60 * 1000);

            let updates = {};
            updates[`users/${targetUserId}/pending_boosts/${boostKey}/status`] = "Approved";
            updates[`users/${targetUserId}/boosts/${serviceId}`] = { expireTime: expireTime };

            let notifData = {
                title: "Boost Activated! ⚡",
                message: `Your boost service has been approved and activated successfully for ${daysMatch} days!`,
                timestamp: Date.now()
            };
            db.ref(`users/${targetUserId}/notifications`).push(notifData);

            db.ref().update(updates).then(() => {
                tg.showAlert("✅ Boost approved and activated successfully!");
            });
        }

        function rejectBoost(targetUserId, boostKey) {
            db.ref(`users/${targetUserId}/pending_boosts/${boostKey}`).update({ status: "Rejected" }).then(() => {
                let notifData = {
                    title: "Boost Request Rejected",
                    message: `Your boost payment proof was rejected by admin. Please contact support.`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData);
                tg.showAlert("❌ Boost request rejected.");
            });
        }

        // নোটিফিকেশন ব্রডকাস্ট (Image Upload File সহ)
        function sendGlobalNotification() {
            let title = document.getElementById('notifTitle').value.trim();
            let message = document.getElementById('notifMessage').value.trim();
            let fileInput = document.getElementById('notifImageFile');

            if (!title || !message) {
                tg.showAlert("⚠️ Please enter title and message!");
                return;
            }

            if (fileInput.files.length > 0) {
                let reader = new FileReader();
                reader.onloadend = function() {
                    broadcastData(title, message, reader.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                broadcastData(title, message, "");
            }
        }

        function broadcastData(title, message, imageUrl) {
            let notifData = {
                title: title,
                message: message,
                image: imageUrl,
                timestamp: Date.now()
            };

            db.ref('users').once('value').then(snap => {
                if (snap.exists()) {
                    let updates = {};
                    snap.forEach(child => {
                        let uId = child.key;
                        let pushKey = db.ref().child(`users/${uId}/notifications`).push().key;
                        updates[`users/${uId}/notifications/${pushKey}`] = notifData;
                    });
                    db.ref().update(updates).then(() => {
                        tg.showAlert("✅ Notification broadcasted with image successfully!");
                        document.getElementById('notifTitle').value = '';
                        document.getElementById('notifMessage').value = '';
                        document.getElementById('notifImageFile').value = '';
                    });
                }
            });
        }

        // সাপোর্ট ইনবক্স এবং এডমিন রিপ্লাই সিস্টেম
        db.ref('support_tickets').on('value', snap => {
            let container = document.getElementById('supportTicketsContainer');
            let html = "";

            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let ticketKey = childSnap.key;
                    let t = childSnap.val();
                    let dateStr = t.timestamp ? new Date(t.timestamp).toLocaleString() : 'N/A';

                    html += `
                        <div class="ticket-row" id="ticket-${ticketKey}">
                            <div class="ticket-info">
                                <b>From:</b> ${t.userName} (${t.userUsername}) [ID: ${t.userId}]<br>
                                <b>Subject:</b> <span style="color:#fbbf24;">${t.subject}</span><br>
                                <b>Message:</b> ${t.message}<br>
                                ${t.adminReply ? `<b style="color:#22c55e;">Admin Reply:</b> ${t.adminReply}<br>` : ''}
                                <span style="font-size:10px; color:var(--text-muted);">${dateStr}</span>
                            </div>
                            <div class="btn-group">
                                <button class="action-sm-btn" onclick="toggleReplyBox('${ticketKey}')">Reply</button>
                                <button class="ban-btn" onclick="deleteTicket('${ticketKey}')">Delete</button>
                            </div>
                            <div class="reply-box" id="replyBox-${ticketKey}">
                                <input type="text" id="replyInput-${ticketKey}" class="form-control" placeholder="Type reply message..." style="margin-top:6px; margin-bottom:6px;">
                                <button class="action-btn" style="padding:6px; font-size:11px;" onclick="sendAdminReply('${ticketKey}', '${t.userId}')">Send Reply to User</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No support tickets in inbox.</small>`;
            }
        });

        function toggleReplyBox(ticketKey) {
            let box = document.getElementById(`replyBox-${ticketKey}`);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function sendAdminReply(ticketKey, targetUserId) {
            let replyMsg = document.getElementById(`replyInput-${ticketKey}`).value.trim();
            if (!replyMsg) {
                alert("Please type a reply message!");
                return;
            }

            db.ref(`support_tickets/${ticketKey}`).update({ adminReply: replyMsg }).then(() => {
                let notifData = {
                    title: "Support Reply from Admin",
                    message: `Admin replied to your ticket: "${replyMsg}"`,
                    timestamp: Date.now()
                };
                db.ref(`users/${targetUserId}/notifications`).push(notifData).then(() => {
                    tg.showAlert("✅ Reply sent to user successfully!");
                });
            });
        }

        function deleteTicket(ticketKey) {
            if(confirm("Delete this support ticket?")) {
                db.ref('support_tickets/' + ticketKey).remove();
            }
        }

        // ফুল ইউজার ম্যানেজমেন্ট (Balance Edit, Reset, Ban/Unban, Total Points)
        db.ref('users').on('value', snap => {
            let container = document.getElementById('usersListContainer');
            let totalElem = document.getElementById('totalUsersCount');
            let activeElem = document.getElementById('activeUsersCount');
            let html = "";
            let total = 0;
            let active = 0;
            let now = Date.now();
            let oneDayMs = 24 * 60 * 60 * 1000;

            if (snap.exists()) {
                snap.forEach(childSnap => {
                    let uId = childSnap.key;
                    let uData = childSnap.val();
                    total++;

                    if (uData.lastSeen && (now - uData.lastSeen <= oneDayMs)) {
                        active++;
                    }

                    let name = uData.name || uData.username || "User";
                    let gp = uData.gp !== undefined ? uData.gp : (uData.points || 0);
                    let gold = uData.gold !== undefined ? uData.gold : 0;
                    let isBanned = uData.isBanned || false;

                    html += `
                        <div class="user-row">
                            <div class="user-info">
                                <b>${name}</b> ${isBanned ? '<span style="color:#ef4444">[BANNED]</span>' : ''}<br>
                                <span style="color: #94a3b8; font-size: 10px;">ID: ${uId}</span><br>
                                <span style="color: #fbbf24;">⚡ GP: <input type="number" id="gp-${uId}" value="${gp}" style="width:60px; background:#050a14; color:#fff; border:1px solid #2a1b4e; border-radius:4px; padding:2px;"> | 🪙 Gold: <input type="number" id="gold-${uId}" value="${gold}" style="width:60px; background:#050a14; color:#fff; border:1px solid #2a1b4e; border-radius:4px; padding:2px;"></span>
                            </div>
                            <div class="btn-group" style="margin-top:6px;">
                                <button class="action-sm-btn" onclick="updateUserBalance('${uId}')">Save</button>
                                <button class="reset-btn" onclick="resetUserBalance('${uId}')">Reset 0</button>
                                <button class="ban-btn" onclick="toggleBanUser('${uId}', ${isBanned})">${isBanned ? 'Unban' : 'Ban'}</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                totalElem.innerText = total;
                activeElem.innerText = active;
            } else {
                container.innerHTML = `<small style="color: var(--text-muted);">No users found.</small>`;
            }
        });

        function updateUserBalance(uId) {
            let newGp = parseInt(document.getElementById(`gp-${uId}`).value) || 0;
            let newGold = parseInt(document.getElementById(`gold-${uId}`).value) || 0;

            db.ref('users/' + uId).update({ gp: newGp, points: newGp, gold: newGold }).then(() => {
                tg.showAlert(`✅ User ID ${uId} balance updated!`);
            });
        }

        function resetUserBalance(uId) {
            if (confirm(`Reset balance to 0 for User ID ${uId}?`)) {
                db.ref('users/' + uId).update({ gp: 0, points: 0, gold: 0 }).then(() => {
                    tg.showAlert(`🔄 Balance reset to 0 for User ID ${uId}`);
                });
            }
        }

        function toggleBanUser(uId, currentStatus) {
            let newStatus = !currentStatus;
            db.ref('users/' + uId).update({ isBanned: newStatus }).then(() => {
                tg.showAlert(newStatus ? `🚫 User ID ${uId} has been Banned.` : `✅ User ID ${uId} has been Unbanned.`);
            });
        }
    </script>
</body>
</html>
