<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfo - Support Inbox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h3 { margin: 0; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 12px 0; font-size: 14px; color: #c084fc; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-control { width: 100%; background: #0b0f19; border: 1px solid var(--card-border); color: #fff; padding: 12px; border-radius: 12px; box-sizing: border-box; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #7c3aed; }

        textarea.form-control { resize: none; height: 100px; }

        .action-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: 0.2s; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
        .action-btn:hover { opacity: 0.9; }
        .action-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        /* নিচের দিকে দুটি ব্যাক অপশন বাটন (Back to Profile এবং Back to Home) */
        .bottom-back-container { display: flex; gap: 10px; margin-top: 20px; }
        .bottom-back-btn { flex: 1; background: #131c2e; border: 1px solid var(--card-border); color: #c084fc; padding: 12px; border-radius: 14px; font-size: 13px; font-weight: 700; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .bottom-back-btn:hover { background: #1a2642; border-color: #7c3aed; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-headset" style="color: #0891b2;"></i> Heyfo Support Inbox</h3>
        </div>

        <!-- সরাসরি ইনবক্স / অভিযোগ ও সাহায্য ফর্ম -->
        <div class="card">
            <h4><i class="fa-solid fa-envelope-open-text"></i> Send Support & Inquiry Message</h4>
            
            <div class="form-group">
                <label>Issue Topic / Subject</label>
                <select id="complaintSubject" class="form-control">
                    <option value="Dollar Card Order Issue">💵 Dollar Card Order Issue</option>
                    <option value="Agent & Account Verification">🛡️ Agent & Account Verification</option>
                    <option value="Sponsor Ad Campaign Issue">📢 Sponsor Ad Campaign Issue</option>
                    <option value="Boost / Task Problem">⚡ Boost / Task Problem</option>
                    <option value="Wallet / Balance Problem">🪙 Wallet / Balance Problem</option>
                    <option value="Other Special Inquiry">❓ Other Special Inquiry</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Message / Details</label>
                <textarea id="complaintMessage" class="form-control" placeholder="Describe your issue clearly here..."></textarea>
            </div>

            <!-- স্ক্রিনশট বা প্রুফ আপলোড অপশন -->
            <div class="form-group">
                <label>Upload Screenshot / Proof (Optional)</label>
                <input type="file" id="supportFile" class="form-control" accept="image/*" onchange="uploadSupportImage(this)">
                <input type="hidden" id="attachmentUrl">
                <small id="uploadStatus" style="color: #38bdf8; font-size: 10px; display: block; margin-top: 4px;"></small>
            </div>

            <button class="action-btn" id="submitBtn" onclick="sendSupportMessage()">Submit to Admin Inbox</button>
        </div>

        <!-- নিচে দুটি ব্যাক অপশন -->
        <div class="bottom-back-container">
            <a href="profile.html" class="bottom-back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
            <a href="index.html" class="bottom-back-btn"><i class="fa-solid fa-house"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let userName = user ? (user.first_name || "User") : "User";
        let userUsername = user && user.username ? `@${user.username}` : `@user`;

        // ক্লাউডিনারির নির্দিষ্ট ফোল্ডারে ছবি আপলোড করার ফাংশন
        function uploadSupportImage(input) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                let statusEl = document.getElementById('uploadStatus');
                let submitBtn = document.getElementById('submitBtn');
                
                statusEl.innerText = "Uploading image...";
                submitBtn.disabled = true;

                let formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'ml_default');
                formData.append('folder', 'Heyfo MiniApp/Support');

                fetch('https://api.cloudinary.com/v1_1/dyqegwdme/image/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.secure_url) {
                        document.getElementById('attachmentUrl').value = data.secure_url;
                        statusEl.innerText = "✅ Image uploaded successfully!";
                        submitBtn.disabled = false;
                    } else {
                        statusEl.innerText = "❌ Upload failed. Try again.";
                        submitBtn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    statusEl.innerText = "❌ Error uploading image.";
                    submitBtn.disabled = false;
                });
            }
        }

        function sendSupportMessage() {
            let subject = document.getElementById('complaintSubject').value;
            let message = document.getElementById('complaintMessage').value.trim();
            let attachmentUrl = document.getElementById('attachmentUrl').value.trim();

            if (!message) {
                tg.showAlert("⚠️ Please type your message or complaint first!");
                return;
            }

            let ticketData = {
                userId: userId,
                userName: userName,
                userUsername: userUsername,
                subject: subject,
                message: message,
                attachmentUrl: attachmentUrl || '',
                status: "Pending",
                timestamp: Date.now()
            };

            db.ref('support_tickets/' + userId + '_' + Date.now()).set(ticketData).then(() => {
                tg.showAlert("✅ Your message has been sent to Admin Inbox successfully!");
                document.getElementById('complaintMessage').value = '';
                document.getElementById('supportFile').value = '';
                document.getElementById('attachmentUrl').value = '';
                document.getElementById('uploadStatus').innerText = '';
            }).catch((error) => {
                tg.showAlert("❌ Failed to send message. Try again!");
            });
        }
    </script>
</body>
</html>
