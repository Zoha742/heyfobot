<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyfobot - Wardrobe Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 0 0 80px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h3 { color: #fff; margin: 0; }
        .balance-badge { background: rgba(254, 240, 138, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; }

        /* প্রোমো / বিজ্ঞাপন ব্যানার কার্ড (ecommerce style) */
        .promo-banner {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px -8px rgba(124, 58, 237, 0.55);
            position: relative;
            overflow: hidden;
        }
        .promo-banner::before {
            content: '';
            position: absolute;
            width: 130px; height: 130px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -45px; right: -35px;
        }
        .promo-banner::after {
            content: '';
            position: absolute;
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            bottom: -25px; right: 40px;
        }
        .promo-text { position: relative; z-index: 1; }
        .promo-text h4 { margin: 0 0 4px 0; font-size: 15px; color: #fff; font-weight: 800; }
        .promo-text p { margin: 0; font-size: 11px; color: rgba(255,255,255,0.85); }
        .promo-icon { font-size: 38px; color: rgba(255,255,255,0.4); position: relative; z-index: 1; }

        /* শপ ক্যাটাগরি নেভিগেশন বার */
        .shop-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .shop-nav::-webkit-scrollbar { display: none; }
        .cat-btn { background: #131c2e; border: 1px solid #2a1b4e; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #94a3b8; }
        .cat-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

        .dress-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        /* প্রোডাক্ট কার্ড - ইকমার্স লুক */
        .dress-card {
            background: #131c2e;
            border: 1px solid #2a1b4e;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: 0.2s;
        }
        .dress-card:active { transform: scale(0.98); }

        .card-img-wrap { position: relative; margin-bottom: 8px; }

        /* টপ ব্যাজ (HOT/NEW/SALE) */
        .card-badge {
            position: absolute; top: 6px; left: 6px; z-index: 2;
            font-size: 9px; font-weight: 800; padding: 3px 8px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
            color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #f97316); }
        .badge-new { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .badge-sale { background: linear-gradient(135deg, #ec4899, #db2777); }

        /* Love / Wishlist বাটন */
        .love-btn {
            position: absolute; top: 6px; right: 6px; z-index: 2;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(11, 15, 25, 0.7); border: none; color: #cbd5e1;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s; font-size: 13px;
        }
        .love-btn.loved { color: #ec4899; }
        .love-btn:active { transform: scale(0.85); }

        .dress-img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #0b0f19; cursor: pointer; display: block; }
        .dress-title { font-size: 13px; font-weight: 600; margin: 0 0 4px 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dress-price { font-size: 12px; font-weight: 700; color: #fbbf24; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }

        .buy-btn {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #fff; border: none; padding: 9px; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer; width: 100%;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .buy-btn:active { opacity: 0.85; }

        /* ইমেজ জুম মডাল */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal img { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 28px; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* মেইন বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #131c2e; border-top: 1px solid #2a1b4e; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: #c084fc; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>🛍️ Wardrobe Store</h3>
            <div class="balance-badge" id="shopBalance">0 Gold</div>
        </div>

        <!-- প্রোমো / বিজ্ঞাপন ব্যানার কার্ড -->
        <div class="promo-banner">
            <div class="promo-text">
                <h4>🔥 Mega Wardrobe Sale</h4>
                <p>Unlock exclusive outfits with your Gold today!</p>
            </div>
            <i class="fa-solid fa-gift promo-icon"></i>
        </div>

        <!-- শপ ক্যাটাগরি নেভিগেশন বার -->
        <div class="shop-nav">
            <button class="cat-btn active" onclick="filterCategory('All', this)">All Outfits</button>
            <button class="cat-btn" onclick="filterCategory('Dress', this)">👗 Female Wardrobe</button>
            <button class="cat-btn" onclick="filterCategory('Boys', this)">👕 Boys Wardrobe</button>
        </div>

        <!-- প্রোডাক্ট গ্রিড কন্টেইনার -->
        <div class="dress-grid" id="dressGrid"></div>
    </div>

    <!-- ইমেজ জুম প্রিভিউ মডাল -->
    <div class="modal" id="imageModal" onclick="closeZoomModal()">
        <span class="close-modal">&times;</span>
        <img id="zoomedImg" src="" alt="Zoomed View">
    </div>

    <!-- বটম নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="game.html"><i class="fa-solid fa-gamepad"></i>Game</a>
        <a class="nav-item" href="task.html"><i class="fa-solid fa-list-check"></i>Task</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeekTPKMLpOhBH_fMB3eIqWgGy8APQFa8",
            authDomain: "heycen-9a9d8.firebaseapp.com",
            databaseURL: "https://heycen-9a9d8-default-rtdb.firebaseio.com",
            projectId: "heycen-9a9d8",
            storageBucket: "heycen-9a9d8.firebasestorage.app",
            messagingSenderId: "442359961958",
            appId: "1:442359961958:web:815606d4836a66003d50a7",
            measurementId: "G-XNQSP1R3JR"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";
        let username = user ? (user.first_name || "User") : "User";
        let userGold = 0;

        // ফায়ারবেস থেকে ইউজারের রিয়েল Gold ব্যালেন্স লোড করা
        db.ref('users/' + userId).on('value', snap => {
            let data = snap.val();
            if(data) {
                userGold = data.gold !== undefined ? data.gold : 0;
                document.getElementById('shopBalance').innerText = userGold.toLocaleString() + " Gold";
            }
        });

        // শপের ভার্চুয়াল অ্যাভাটার আইটেমগুলো (কসমেটিকস ও ওয়ার্ডরোব ড্রেস)
        const storeItems = [
            { name: "Royal Floral Gown", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/2_g6yybc.webp" },
            { name: "Classic Party Dress", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/4_jwi1bs.webp" },
            { name: "Elegance Evening Wear", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/7_zz8gga.webp" },
            { name: "Casual Denim Outfit", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180133/1_ufizyp.webp" },
            { name: "Summer Breeze Gown", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/3_tm4w9f.webp" },
            { name: "Chic Party Frock", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/5_lphyur.webp" },
            { name: "Modern Denim Style", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/6_a7nrjj.webp" },
            { name: "Velvet Night Outfit", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180132/9_pyynus.webp" },
            { name: "Designer Casual Wear", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/8_rnhjh5.webp" },
            { name: "Luxury Party Gown", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/10_l7enmg.webp" },
            { name: "Graceful Maxi Dress", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/19_fazthb.webp" },
            { name: "Stylish Evening Look", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/16_ff8bo3.webp" },
            { name: "Premium Party Dress", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/11_nmuqvi.webp" },
            { name: "Trend Setter Denim", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180131/17_nevt22.webp" },
            { name: "Royal Blue Gown", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/21_g8xdy3.webp" },
            { name: "Classic Evening Style", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/18_vtbuam.webp" },
            { name: "Modest Casual Fit", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/12_lxoxkk.webp" },
            { name: "Special Event Gown", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/14_vv3edn.webp" },
            { name: "Vibrant Party Frock", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180130/13_j1iqqj.webp" },
            { name: "Urban Denim Wear", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/20_nl0iqq.webp" },
            { name: "Exquisite Evening Gown", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/22_ostfn4.webp" },
            { name: "Daily Casual Set", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/24_pbzdij.webp" },
            { name: "Chic Designer Dress", cat: "Dress", price: 15000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/23_exv5bf.webp" },
            { name: "Elite Collection Gown", cat: "Dress", price: 20000, img: "https://res.cloudinary.com/dyqegwdme/image/upload/v1788180129/15_vgqlvi.webp" },

            // Boys Wardrobe Items
            { name: "Formal Blazer Suit", cat: "Boys", price: 15000, img: "https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=300" },
            { name: "Casual Hoodie & Jeans", cat: "Boys", price: 20000, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
            { name: "Executive 3-Piece Suit", cat: "Boys", price: 20000, img: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=300" }
        ];

        // Wishlist (love) state লোকাল স্টোরেজে সেভ থাকবে
        function getLovedItems() {
            return JSON.parse(localStorage.getItem('lovedItems') || '[]');
        }

        function toggleLove(btn, itemName) {
            event.stopPropagation();
            let loved = getLovedItems();
            let icon = btn.querySelector('i');
            if (loved.includes(itemName)) {
                loved = loved.filter(n => n !== itemName);
                btn.classList.remove('loved');
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
            } else {
                loved.push(itemName);
                btn.classList.add('loved');
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid');
            }
            localStorage.setItem('lovedItems', JSON.stringify(loved));
        }

        // প্রতিটা কার্ডে HOT/NEW/SALE ব্যাজ বসানোর জন্য
        function getBadge(index) {
            let mod = index % 5;
            if (mod === 0) return { cls: 'badge-hot', text: 'HOT' };
            if (mod === 2) return { cls: 'badge-new', text: 'NEW' };
            if (mod === 4) return { cls: 'badge-sale', text: 'SALE' };
            return null;
        }

        function renderItems(list) {
            const dressGrid = document.getElementById('dressGrid');
            const lovedItems = getLovedItems();
            dressGrid.innerHTML = '';

            list.forEach((item, index) => {
                let badge = getBadge(index);
                let isLoved = lovedItems.includes(item.name);

                dressGrid.innerHTML += `
                    <div class="dress-card">
                        <div class="card-img-wrap">
                            ${badge ? `<span class="card-badge ${badge.cls}">${badge.text}</span>` : ''}
                            <button class="love-btn ${isLoved ? 'loved' : ''}" onclick="toggleLove(this, '${item.name.replace(/'/g, "\\'")}')">
                                <i class="fa-${isLoved ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                            <img src="${item.img}" class="dress-img" alt="Virtual Item" onclick="openZoomModal('${item.img}')" title="Click to zoom">
                        </div>
                        <div class="dress-title">${item.name}</div>
                        <div class="dress-price"><i class="fa-solid fa-coins"></i> ${item.price.toLocaleString()} Gold</div>
                        <button class="buy-btn" onclick="confirmUnlock('${item.name.replace(/'/g, "\\'")}', ${item.price}, ${index})">
                            <i class="fa-solid fa-bag-shopping"></i> Buy Now
                        </button>
                    </div>
                `;
            });
        }

        renderItems(storeItems);

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'All') {
                renderItems(storeItems);
            } else {
                let filtered = storeItems.filter(i => i.cat === cat);
                renderItems(filtered);
            }
        }

        function openZoomModal(imgSrc) {
            document.getElementById('zoomedImg').src = imgSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeZoomModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function confirmUnlock(itemName, price, itemId) {
            let itemNameFinal = itemName;

            db.ref('users/' + userId).once('value', snapshot => {
                let uData = snapshot.val() || {};

                if (userGold >= price) {
                    let newGold = userGold - price;

                    db.ref('users/' + userId).update({ gold: newGold }).then(() => {
                        let unlockData = {
                            userId: userId,
                            userName: username,
                            itemName: itemNameFinal,
                            price: price,
                            type: "Virtual Wardrobe Unlock",
                            timestamp: Date.now()
                        };

                        // ভার্চুয়াল আইটেম আনলক হিসেবে সেভ হবে, কোনো শিপিং বা ফিজিক্যাল অর্ডারের ঝামেলা নেই
                        db.ref('virtual_wardrobe_unlocks').push(unlockData);
                        db.ref('users/' + userId + '/wardrobe').push(unlockData).then(() => {
                            tg.showAlert(`🎉 Success! "${itemNameFinal}" added to your virtual wardrobe.`);
                        });
                    });
                } else {
                    tg.showAlert("❌ Insufficient Gold Balance! Play games to earn more Gold Points.");
                }
            });
        }
    </script>
</body>
</html>
